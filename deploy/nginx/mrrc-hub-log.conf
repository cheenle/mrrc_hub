# Managed by mrrc_hub/deploy/deploy_hub_routes.sh — edits are overwritten.
#
# Query strings are deliberately NOT logged for the hub vhost (AD-H07 / NFR-H014):
# a session token must never reach a log, and the instance still honours the
# deprecated ?token= for installed native clients. Structured observability
# belongs to the Fleet control plane, not to the edge access log.
#
# `$host` 是**必须**的（2026-10-25）。一个 access log 同时装着门户和全部实例，
# 少了它就没有任何一条 502 能归到具体实例上 —— 2026-10-22 那次「入口 502 四天」
# 只能靠 error.log 末段的 `host:` 反推，正是因为这里没有它（而 error.log 只记
# 出错的那部分，正常请求的分布根本无从统计）。
#
# 只加 host。**不**加 `$request_uri`（与 `$uri` 重复）也**不**加 `$args`（会带令牌）。
log_format hub_safe '$host $remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent ua="$http_user_agent" rt=$request_time';
